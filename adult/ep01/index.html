/* ── PARSE ── */
function parseScript(raw) {
  const parts = [];
  const regex = /\[(KO|EN)\]\s*/g;
  let match;
  const tags = [];
  while ((match = regex.exec(raw)) !== null) {
    tags.push({ lang: match[1].toLowerCase(), idx: match.index, end: regex.lastIndex });
  }
  for (let i = 0; i < tags.length; i++) {
    const textStart = tags[i].end;
    const textEnd = (i + 1 < tags.length) ? tags[i + 1].idx : raw.length;
    const body = raw.substring(textStart, textEnd).trim();
    if (body) parts.push({ lang: tags[i].lang, body });
  }
  return parts;
}

const sections = parseScript(RAW_SCRIPT);

/*
 * ── SCROLL MAP ──
 * Maps section index ranges to CSS selectors in the iframe.
 * { maxIdx, selector, tab? [prefix, level] }
 * "maxIdx" = last section index (inclusive) this rule covers.
 */
const scrollMap = [
  { maxIdx:  1, sel: null },                   /* opening — stay on image, no scroll */
  { maxIdx:  8, sel: '.key-card' },            /* key expression + practice */
  { maxIdx: 14, sel: '.story-kr' },            /* story dialogue */
  { maxIdx: 22, sel: '.story-kr' },            /* grammar patterns */
  { maxIdx: 39, sel: '.story-kr' },            /* vocab words */
  { maxIdx: 41, sel: '#story-a1', tab: ['story','a1'] },
  { maxIdx: 43, sel: '#story-a2', tab: ['story','a2'] },
  { maxIdx: 46, sel: '#story-b1', tab: ['story','b1'] },
  { maxIdx: 62, sel: '#quiz-a1',  tab: ['quiz','a1'] },
  { maxIdx: 83, sel: '#quiz-a2',  tab: ['quiz','a2'] },
  { maxIdx: 89, sel: '#g1bl' },               /* game 1 */
  { maxIdx: 92, sel: '#g2zone' },             /* game 2 */
  { maxIdx:103, sel: '#g3fb' },               /* game 3 */
  { maxIdx:108, sel: '#g4bl' },               /* game 4 */
  { maxIdx:111, sel: '#g5fb' },               /* game 5 */
  { maxIdx:116, sel: '#g6fb' },               /* game 6 */
  { maxIdx:999, sel: '#ai-tutor-widget' },    /* closing — AI tutor area */
];

/* ── STATE ── */
let curIdx       = 0;
let playing      = false;
let playbackRate = 1.0;
let audio        = null;
let blobUrl      = null;
let endTimer     = null;

/* ── DOM ── */
const playBtn = document.getElementById('ttsPlayBtn');
const infoEl  = document.getElementById('ttsInfo');
const frame   = document.getElementById('epFrame');

/* ── SCROLL VIA postMessage (no direct iframe DOM access) ── */
function iframeScroll(idx) {
  const rule = scrollMap.find(r => idx <= r.maxIdx);
  if (!rule || !rule.sel) return;  /* null sel = stay put (e.g. opening image) */
  try {
    const win = frame.contentWindow;
    if (!win) return;
    if (rule.tab) {
      win.postMessage({ type: 'showTab', prefix: rule.tab[0], level: rule.tab[1] }, '*');
    }
    win.postMessage({ type: 'scrollTo', selector: rule.sel }, '*');
  } catch(e) {}
}

/* ── AUDIO CLEANUP ── */
function stopAudio() {
  if (endTimer) { clearTimeout(endTimer); endTimer = null; }
  if (audio) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    audio = null;
  }
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
}

/* ── TTS FETCH & PLAY ── */
async function playSection(idx) {
  if (idx >= sections.length) { finish(); return; }

  stopAudio();
  curIdx = idx;
  iframeScroll(idx);
  infoEl.textContent = (idx + 1) + '/' + sections.length;

  const sec  = sections[idx];
  const isKo = sec.lang === 'ko';

  let blob;
  try {
    const res = await fetch(TTS_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + TTS_TOKEN,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text:  sec.body,
        voice: isKo ? 'alloy' : 'fable',
        speed: isKo ? 1.0 : 0.75
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    blob = await res.blob();
  } catch(e) {
    infoEl.textContent = 'ERR';
    console.error('TTS error:', e);
    if (playing) { setTimeout(() => playSection(idx + 1), 300); }
    return;
  }

  if (!playing) return;

  blobUrl = URL.createObjectURL(blob);
  audio = new Audio(blobUrl);
  audio.playbackRate = playbackRate;

  let ended = false;
  function onEnd() {
    if (ended) return;
    ended = true;
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
    if (playing) playSection(idx + 1);
  }

  audio.addEventListener('ended', onEnd);
  audio.addEventListener('error', () => { infoEl.textContent = 'ERR'; onEnd(); });

  try {
    await audio.play();
    // Fallback timeout in case ended event doesn't fire
    if (audio.duration && isFinite(audio.duration)) {
      endTimer = setTimeout(onEnd, (audio.duration / playbackRate) * 1000 + 600);
    } else {
      audio.addEventListener('loadedmetadata', () => {
        if (!ended && audio.duration && isFinite(audio.duration)) {
          endTimer = setTimeout(onEnd, (audio.duration / playbackRate) * 1000 + 600);
        }
      });
    }
  } catch(e) {
    infoEl.textContent = 'ERR';
    console.error('Play error:', e);
    onEnd();
  }
}

/* ── CONTROLS ── */
function toggleTTS() {
  if (playing) {
    playing = false;
    if (audio) audio.pause();
    playBtn.textContent = '\u25B6';
    playBtn.classList.remove('active');
    infoEl.textContent = 'Paused';
  } else {
    playing = true;
    playBtn.textContent = '\u23F8';
    playBtn.classList.add('active');

    if (audio && audio.paused && audio.currentTime > 0 && !audio.ended) {
      audio.play();
    } else {
      playSection(curIdx);
    }
  }
}

function ttsNext() {
  stopAudio();
  curIdx = Math.min(curIdx + 1, sections.length - 1);
  if (playing) playSection(curIdx);
  else { iframeScroll(curIdx); infoEl.textContent = (curIdx + 1) + '/' + sections.length; }
}

function ttsPrev() {
  stopAudio();
  curIdx = Math.max(curIdx - 1, 0);
  if (playing) playSection(curIdx);
  else { iframeScroll(curIdx); infoEl.textContent = (curIdx + 1) + '/' + sections.length; }
}

function onSpeedChange() {
  playbackRate = parseFloat(document.getElementById('ttsSpeed').value);
  if (audio) audio.playbackRate = playbackRate;
}

function finish() {
  playing = false;
  playBtn.textContent = '\u25B6';
  playBtn.classList.remove('active');
  infoEl.textContent = 'Done';
}

/* ── KEYBOARD ── */
document.addEventListener('keydown', (e) => {
  // Only handle if not typing in an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'F2')         { e.preventDefault(); toggleTTS(); }
  else if (e.code === 'F3')    { e.preventDefault(); ttsNext(); }
  else if (e.code === 'F1')    { e.preventDefault(); ttsPrev(); }
});
</script>
</body>
</html>
